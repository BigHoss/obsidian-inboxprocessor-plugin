name: Release

# Trigger on push to main: when manifest.json's version has been bumped
# (typically via scripts/release.ps1), this workflow creates the matching
# git tag (vX.Y.Z) and a GitHub Release with main.js, manifest.json, and
# styles.css attached.
#
# No manual tag management required: push main, action does the rest.
#
# Manual re-runs are also supported via the Actions tab → "Run workflow"
# with a custom tag input (used for re-releasing after fixing a bad tag,
# or publishing a tag from a non-main branch).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js || (echo "main.js missing" && exit 1)
          test -f manifest.json || (echo "manifest.json missing" && exit 1)
          test -f styles.css || (echo "styles.css missing" && exit 1)
          echo "All three plugin assets present"

      - name: Resolve target tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Target tag: ${{ steps.target.outputs.tag }}"

      - name: Check if tag exists on remote
        id: tagcheck
        run: |
          # Query the remote directly — local clone may or may not have
          # the tag depending on fetch behavior. We want to know whether
          # the *remote* has the tag.
          if git ls-remote --tags origin "refs/tags/${{ steps.target.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.target.outputs.tag }} already exists on remote"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.target.outputs.tag }} does not exist on remote"
          fi

      - name: Create and push tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.target.outputs.tag }}"
          git push origin "${{ steps.target.outputs.tag }}"
          echo "Created and pushed ${{ steps.target.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: "Link Inbox Processor ${{ steps.target.outputs.tag }}"
          body: |
            See the [v${{ steps.version.outputs.version }}/Plan.md](https://github.com/${{ github.repository }}/blob/${{ steps.target.outputs.tag }}/v${{ steps.version.outputs.version }}/Plan.md) for the full change list.

            ## Install

            Use [BRAT](https://github.com/TfTHacker/obsidian42-brat) and add this repo as a beta plugin, or drop `main.js`, `manifest.json`, `styles.css` into `<vault>/.obsidian/plugins/kuster-inbox-processor/`.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
