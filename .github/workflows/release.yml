name: Release

# Trigger on push to main. The workflow:
#  1. Builds the plugin (npm run build)
#  2. Runs `npx standard-version` to bump manifest.json / package.json /
#     versions.json, generate CHANGELOG.md, commit the bump locally,
#     and create the matching vX.Y.Z tag.
#  3. Pushes the bump commit and the tag to origin.
#  4. Publishes a GitHub Release with the three plugin assets attached.
#
# Conventional Commits drive the bump level:
#   - BREAKING CHANGE: footer or feat!: / fix!: prefix → major
#   - feat: → minor
#   - fix: → patch
#   - everything else → no bump
#
# Override the auto-detected bump type via workflow_dispatch input.
# Run the workflow from the Actions tab, select "patch / minor / major"
# from the dropdown, and standard-version is invoked with --release-as.
#
# No local tag management required. No local `gh release create` needed.
# Push main, the action does the rest.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      releaseAs:
        description: "Force a specific bump type. Leave blank to auto-detect from commit messages."
        required: false
        type: choice
        options: [patch, minor, major]
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so standard-version can see all commits since
          # the last tag and compute the next semver.
          fetch-depth: 0
          # Persist credentials so subsequent git push steps work.
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GH Actions runners as of 2025-09-19
          # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
          # Pin to 24 to match the current runner default and silence the warning.
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js || (echo "main.js missing" && exit 1)
          test -f manifest.json || (echo "manifest.json missing" && exit 1)
          test -f styles.css || (echo "styles.css missing" && exit 1)
          echo "All three plugin assets present"

      - name: Bump version with standard-version
        id: bump
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          if [ -n "${{ inputs.releaseAs }}" ]; then
            echo "Forcing release type: ${{ inputs.releaseAs }}"
            npx standard-version --release-as "${{ inputs.releaseAs }}"
          else
            echo "Auto-detecting release type from commit messages..."
            npx standard-version
          fi
          # After standard-version runs, manifest.json has the new version.
          # Read it for the next steps.
          NEW_VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$NEW_VERSION"

      - name: Push release commit and tag
        run: |
          git push origin main
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "Pushed release commit and tag v${{ steps.bump.outputs.version }}"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: "Link Inbox Processor v${{ steps.bump.outputs.version }}"
          body: |
            See the [v${{ steps.bump.outputs.version }}/Plan.md](https://github.com/${{ github.repository }}/blob/v${{ steps.bump.outputs.version }}/v${{ steps.bump.outputs.version }}/Plan.md) for the full change list. If the file does not exist for this version, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ steps.bump.outputs.version }}/CHANGELOG.md) for the auto-generated change list.

            ## Install

            Use [BRAT](https://github.com/TfTHacker/obsidian42-brat) and add this repo as a beta plugin, or drop `main.js`, `manifest.json`, `styles.css` into `<vault>/.obsidian/plugins/kuster-inbox-processor/`.
          draft: false
          prerelease: false
          # generate_release_notes appends an auto-generated changelog on
          # first publish; on subsequent runs of the same tag, it stays
          # (doesn't duplicate, doesn't clobber — softprops is idempotent
          # here).
          generate_release_notes: true
          # overwrite_files_in_existing_release: true ensures re-runs
          # replace the three assets with the freshly-built ones, so a
          # bad build never sticks.
          overwrite_files_in_existing_release: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
