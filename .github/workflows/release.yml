name: Release

# Trigger on tag push matching v* (e.g. v0.4.1).
# Tag is pushed by scripts/release.ps1 or manually:
#   git tag v0.4.1
#   git push origin v0.4.1
# This workflow builds the plugin and attaches main.js, manifest.json,
# styles.css to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so package-lock.json can be resolved.
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: ${{ steps.tag.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js || (echo "main.js missing" && exit 1)
          test -f manifest.json || (echo "manifest.json missing" && exit 1)
          test -f styles.css || (echo "styles.css missing" && exit 1)
          echo "All three plugin assets present"

      - name: Extract version from manifest
        id: version
        run: |
          node -e "console.log('version=' + require('./manifest.json').version)" >> "$GITHUB_OUTPUT"

      - name: Sanity check version matches tag
        run: |
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Link Inbox Processor ${{ steps.tag.outputs.tag }}"
          body: |
            See [the work-note plan](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.tag }}/v${{ steps.version.outputs.version }}/Plan.md) for the full change list.

            ## Install

            Use [BRAT](https://github.com/TfTHacker/obsidian42-brat) and add this repo as a beta plugin, or drop `main.js`, `manifest.json`, `styles.css` into `<vault>/.obsidian/plugins/kuster-inbox-processor/`.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
